plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'maven-publish'
}

android {
    namespace 'com.cormor.overscroll.core'
    compileSdk 37

    defaultConfig {
        minSdk 23
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    api 'androidx.compose.animation:animation:1.12.1'
    api 'androidx.compose.foundation:foundation:1.12.1'
    api 'androidx.compose.runtime:runtime:1.12.1'
    api 'androidx.compose.ui:ui:1.12.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Cormor.ComposeOverscroll'
                artifactId = 'overscroll_core'
                version = System.getenv('VERSION') ?: '2.0.0'
            }
        }
    }
}
